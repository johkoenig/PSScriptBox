name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      matrix:
        shell:
          - powershell
          - pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Run tests
        shell: ${{ matrix.shell }}
        run: .\tests\Invoke-Tests.ps1
