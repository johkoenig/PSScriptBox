name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      matrix:
        shell:
          - powershell
          - pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Run tests
        id: tests
        shell: ${{ matrix.shell }}
        run: |
          $coveragePath = Join-Path ([System.IO.Path]::GetTempPath()) 'scriptbox-coverage.xml'
          "coverage_path=$coveragePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\tests\Invoke-Tests.ps1 -Coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shell }}
          path: ${{ steps.tests.outputs.coverage_path }}
