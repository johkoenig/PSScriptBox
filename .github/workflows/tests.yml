name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  script-analyzer:
    name: PSScriptAnalyzer (PowerShell 7)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -ge [version]'1.21.0' })) {
              foreach ($attempt in 1..3) {
                  try {
                      Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -Scope CurrentUser -ErrorAction Stop
                      break
                  }
                  catch {
                      if ($attempt -eq 3) { throw }
                      Start-Sleep -Seconds (10 * $attempt)
                  }
              }
          }

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: .\tests\Invoke-PSScriptAnalyzer.ps1

  tests-powershell:
    name: Tests (Windows PowerShell 5.1)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
              foreach ($attempt in 1..3) {
                  try {
                      Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -ErrorAction Stop
                      break
                  }
                  catch {
                      if ($attempt -eq 3) { throw }
                      Start-Sleep -Seconds (10 * $attempt)
                  }
              }
          }

      - name: Run tests
        id: tests
        shell: powershell
        run: |
          $coveragePath = Join-Path ([System.IO.Path]::GetTempPath()) 'PSScriptBox-coverage.xml'
          "coverage_path=$coveragePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\tests\Invoke-Tests.ps1 -Coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows-powershell-5.1
          path: ${{ steps.tests.outputs.coverage_path }}

  tests-pwsh:
    name: Tests (PowerShell 7)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
              foreach ($attempt in 1..3) {
                  try {
                      Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -ErrorAction Stop
                      break
                  }
                  catch {
                      if ($attempt -eq 3) { throw }
                      Start-Sleep -Seconds (10 * $attempt)
                  }
              }
          }

      - name: Run tests
        id: tests
        shell: pwsh
        run: |
          $coveragePath = Join-Path ([System.IO.Path]::GetTempPath()) 'PSScriptBox-coverage.xml'
          "coverage_path=$coveragePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\tests\Invoke-Tests.ps1 -Coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-powershell-7
          path: ${{ steps.tests.outputs.coverage_path }}
